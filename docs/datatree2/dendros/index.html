<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dendros Docs Tree</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02090f;
        }

        #banner3d {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.163.0"
            }
        }
    </script>
    <script src="../../include/analytics.js"></script>
</head>

<body>
    <!-- The repo's own docs/ tree, ingested from git history by
         ingestion/github-tree-ingest.mjs and rendered by DatatreeVis -->
    <div id="banner3d" data-fill="viewport" aria-label="Dendros Labs docs tree"></div>

    <script type="module">
        import { dataTreeStateEvolution } from '../data/dendros-docs.js?v=2';
        import { DatatreeVis } from '../datatree-vis.js?v=5';
        new DatatreeVis(document.getElementById('banner3d'), dataTreeStateEvolution);
    </script>
    <script type="module" src="../../include/thc_chrome.js"></script>
</body>

</html>
